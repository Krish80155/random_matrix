[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"


[project]
name = "random-matrix"
version = "1.0.0"
description = "A Matrix-style falling random number terminal animation"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    {name = "Murali Krishna S"}
]


[project.scripts]
random-matrix = "random_matrix.main:main"